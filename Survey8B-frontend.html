    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

      const s = document.createElement('script');

lch(0.7 0.16 38); color: white; }\n  @keyframes driftX1 { 0%{ transform: translateX(-12vw); } 50%{ transform: translateX(14vw); } 100%{ transform: translateX(-12vw); } }\n  @keyframes driftX2 { 0%{ transform: translateX(8vw); } 50%{ transform: translateX(-22vw); } 100%{ transform: translateX(8vw); } }\n  @keyframes driftX3 { 0%{ transform: translateX(-6vw); } 50%{ transform: translateX(18vw); } 100%{ transform: translateX(-6vw); } }\n  @keyframes winFlicker { 0%,45%,95%,100%{ opacity: 0.06; } 55%,85%{ opacity: 0.85; } }\n  @keyframes rainFall { 0%{ top:-5%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:105%; opacity:0; } }\n  @keyframes pixelSplash { 0%,88%,100%{ opacity:0; } 91%{ opacity:1; } 95%{ opacity:1; } 99%{ opacity:0; } }\n  select { appearance: none; -webkit-appearance: none; }\n  a { color: oklch(0.5 0.15 40); }\n  a:hover { color: oklch(0.4 0.16 38); }\n  #survey-input-card:hover { border-color: rgba(230,109,66,0.4); box-shadow: 0 0 0 1px rgba(230,109,66,0.25), 0 0 14px rgba(230,109,66,0.18), 0 12px 32px oklch(0.4 0.06 245 / 0.16); }\n  #survey-input-card:focus-within { border-color: rgba(230,109,66,0.55); box-shadow: 0 0 0 1.5px rgba(230,109,66,0.4), 0 0 18px rgba(230,109,66,0.28), 0 12px 32px oklch(0.4 0.06 245 / 0.16); }\n  @keyframes s8bDotBlink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }\n  .s8b-dots { display: inline-flex; gap: 3px; vertical-align: middle; }\n  .s8b-dots span { width: 4px; height: 4px; border-radius: 50%; background: oklch(0.55 0.15 40); animation: s8bDotBlink 1.1s infinite ease-in-out; }\n  .s8b-dots span:nth-child(2) { animation-delay: 0.15s; }\n  .s8b-dots span:nth-child(3) { animation-delay: 0.3s; }\n  .s8b-dots-onbutton span { background: white; }\n  .s8b-info-wrap { position: relative; display: inline-block; }\n  .s8b-info-wrap .s8b-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(3px); background: oklch(0.22 0.03 258); color: white; font-size: 11px; font-weight: 500; line-height: 1.4; padding: 7px 10px; border-radius: 8px; white-space: nowrap; box-shadow: 0 10px 24px rgba(20,20,30,0.28); opacity: 0; visibility: hidden; transition: opacity 0.1s ease, transform 0.1s ease; pointer-events: none; z-index: 60; }\n  .s8b-info-wrap .s8b-tooltip::after { content: \"\"; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: oklch(0.22 0.03 258); }\n  .s8b-info-wrap:hover .s8b-tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }\n  .s8b-copied-badge { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: oklch(0.22 0.03 258); color: white; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 7px; white-space: nowrap; box-shadow: 0 8px 20px rgba(20,20,30,0.25); pointer-events: none; }\n  .s8b-sample-input::placeholder { color: oklch(0.78 0.015 255); font-weight: 400; opacity: 1; }\n  .s8b-sample-input::-webkit-input-placeholder { color: oklch(0.78 0.015 255); font-weight: 400; }\n\n  /* Mobile layout: minimal nav (logo + wordmark + CTA, no link row),\n     example cards become a horizontal scroll strip instead of stacking\n     full-width, and the \"What\" section's decorative background images\n     (which are sized/positioned for a wide desktop canvas) are dropped\n     rather than trying to make them work at phone width. */\n  @media (max-width: 640px) {\n    .s8b-nav { padding: 8px 14px !important; }\n    .s8b-nav-logo { width: 26px !important; height: 26px !important; }\n    .s8b-nav-wordmark { font-size: 30px !important; }\n    .s8b-nav-links { display: none !important; }\n    .s8b-nav-cta { padding: 7px 13px !important; font-size: 11px !important; }\n\n    .s8b-decor-bg { display: none !important; }\n\n    /* Example-card modal: the desktop screenshot is a wide side-by-side\n       layout that renders illegibly tiny when squeezed into a phone-width\n       modal — swap in the pre-rendered mobile-shaped screenshot instead. */\n    .s8b-shot-desktop { display: none !important; }\n    .s8b-shot-mobile { display: block !important; }\n\n    .s8b-cards-row { flex-wrap: nowrap !important; overflow-x: auto !important; justify-content: flex-start !important; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; padding-bottom: 6px !important; }\n    .s8b-card-item { flex: 0 0 190px !important; min-width: 190px !important; max-width: 190px !important; scroll-snap-align: start; }\n\n    /* Result card: stack the donut column above the takeaway/summary text\n       instead of sitting side by side. An earlier attempt relied on\n       flex-wrap while also zeroing the text column's min-width — but that\n       min-width:260px was the very thing that forced the wrap, so removing\n       it let both columns squeeze side by side at ~150px each, wrapping the\n       summary to 2-3 words per line. Force the column direction explicitly\n       instead of depending on wrap behaviour. */\n    .s8b-result-top-row { flex-direction: column !important; align-items: center !important; gap: 18px !important; }\n    .s8b-result-top-row > div:first-child { flex: none !important; width: 100% !important; }\n    .s8b-result-top-row > div:last-child { flex: none !important; min-width: 0 !important; width: 100% !important; }\n    /* Legend: each percentage row left-aligned with the others (was\n       inheriting the chart column's centered cross-axis alignment, so\n       shorter rows drifted toward the middle instead of lining up). */\n    .s8b-legend-list { align-items: flex-start !important; }\n    .s8b-legend-row { width: 100% !important; justify-content: flex-start !important; }\n\n    /* Why/How sections: the decorative image wrappers reserve fixed\n       desktop-sized boxes (300x375, 240x180) even with their image hidden,\n       which left a large empty gap between the sections. How's text also\n       carried a padding-left:80px meant to clear its (left-hand, order:1)\n       image, which is why it looked mis-aligned relative to Why. */\n    .s8b-decor-wrap { display: none !important; }\n    .s8b-how-text { padding-left: 0 !important; }\n\n    /* Footer: force an explicit vertical stack in a specific order\n       (brand -> links -> social/byline) instead of relying on flex-wrap,\n       which was wrapping unpredictably and reportedly clipping content\n       against the section's overflow:hidden. Also stack \"Key Links\" and\n       \"Other free sites\" instead of sitting side by side. */\n    .s8b-footer { overflow: visible !important; }\n    .s8b-footer-row { flex-direction: column !important; align-items: flex-start !important; gap: 28px !important; }\n    .s8b-footer-brand { order: 1; max-width: none !important; }\n    .s8b-footer-links { order: 2; width: 100%; flex-direction: column !important; gap: 24px !important; }\n    .s8b-footer-social { order: 3; align-self: center !important; }\n\n    #s8b-back-to-top { display: flex !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav data-screen-label=\"Nav\" class=\"s8b-nav\" style=\"position:sticky;top:10px;margin-top:10px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:11px 32px;border-radius:999px;background:{{ navBg }};backdrop-filter:{{ navBlur }};-webkit-backdrop-filter:{{ navBlur }};border:1px solid {{ navBorder }};transition:background 0.25s ease, border-color 0.25s ease;\">\n  <div style=\"display:flex;align-items:center;gap:10px;\">\n    <img src=\"images/s8b-logo.png\" alt=\"Survey8b\" class=\"s8b-nav-logo\" style=\"width:36px;height:36px;object-fit:contain;\">\n    <span class=\"s8b-nav-wordmark\" style=\"font-family:'Micro 5',monospace;font-weight:400;font-size:36px;line-height:1;letter-spacing:-0.03em;background:linear-gradient(90deg, #E66D42 0%, #C34422 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0px 2px 5px rgba(208,86,86,0.25);\">Survey8b<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:36px;\">\n    <div class=\"s8b-nav-links\" style=\"display:flex;align-items:center;gap:28px;font-size:13.5px;font-weight:600;\">\n      <a href=\"#what\" style=\"text-decoration:none;color:oklch(0.3 0.03 258);transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">What<\u002Fa>\n      <a href=\"#why\" style=\"text-decoration:none;color:oklch(0.3 0.03 258);transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">Why<\u002Fa>\n      <a href=\"#how\" style=\"text-decoration:none;color:oklch(0.3 0.03 258);transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">How<\u002Fa>\n      <a href=\"#faqs\" style=\"text-decoration:none;color:oklch(0.3 0.03 258);transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">FAQs<\u002Fa>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ scrollToInput }}\" class=\"s8b-nav-cta\" style=\"padding:9px 20px;border-radius:10px;background:linear-gradient(120deg, oklch(0.68 0.16 40), oklch(0.56 0.17 35));color:white;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px oklch(0.6 0.17 38 / 0.35);transition:transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;\" style-hover=\"filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 20px oklch(0.6 0.17 38 / 0.45);\" style-active=\"transform:translateY(1px) scale(0.96);filter:brightness(0.94);box-shadow:0 4px 10px oklch(0.6 0.17 38 / 0.3);\">Run Survey<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<div style=\"font-family:'IBM Plex Sans',sans-serif;color:oklch(0.24 0.03 258);width:100%;overflow-x:hidden;background:linear-gradient(180deg, oklch(0.96 0.012 235) 0%, oklch(0.89 0.03 240) 22%, oklch(0.78 0.05 246) 42%, oklch(0.62 0.07 250) 65%, oklch(0.46 0.07 252) 85%, oklch(0.3 0.06 254) 100%);\">\n\n  <div style=\"position:relative;\">\n    <!-- Decorative backdrop (dot pattern + drifting clouds) clips itself, so\n         the section wrapper can stay overflow:visible — otherwise it would\n         also clip the filter dropdowns, which need to spill past it. -->\n    <div style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none;\">\n      <div style=\"position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px);background-size:5px 5px;opacity:0.45;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 92%);mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 92%);\"><\u002Fdiv>\n\n      <sc-if value=\"{{ cloudsEnabled }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;top:60px;left:2%;width:290px;height:95px;box-shadow:{{ cloudBig }};animation:driftX1 95s ease-in-out infinite;filter:blur(11px);opacity:0.55;\"><\u002Fdiv>\n        <div style=\"position:absolute;top:190px;left:45%;width:215px;height:70px;box-shadow:{{ cloudMed }};animation:driftX2 120s ease-in-out infinite;filter:blur(9px);opacity:0.5;\"><\u002Fdiv>\n        <div style=\"position:absolute;top:20px;left:70%;width:150px;height:50px;box-shadow:{{ cloudSmall }};animation:driftX3 80s ease-in-out infinite;filter:blur(7px);opacity:0.45;\"><\u002Fdiv>\n        <div style=\"position:absolute;top:250px;left:-4%;width:150px;height:50px;box-shadow:{{ cloudSmall }};animation:driftX1 105s ease-in-out infinite;filter:blur(7px);opacity:0.45;\"><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <header data-screen-label=\"Hero\" style=\"position:relative;max-width:900px;margin:0 auto;padding:56px 24px 8px;text-align:center;\">\n      <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;line-height:1.15;margin:0 0 18px;color:oklch(0.2 0.03 258);\">Survey Your Audience's <span style=\"color:oklch(0.5 0.15 40);\">AI Persona<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.6;color:oklch(0.34 0.03 258);max-width:620px;margin:0 auto 32px;\">Validate your content and product ideas by asking <strong style=\"font-weight:700;color:oklch(0.24 0.03 258);\">~1M simulated persona agents<\u002Fstrong>. Powered by MatrAIx data, MIT.<\u002Fp>\n    <\u002Fheader>\n\n    <div data-screen-label=\"Survey form\" style=\"position:relative;max-width:760px;margin:0 auto;padding:0 24px 48px;\">\n      <div id=\"survey-input-card\" style=\"background:oklch(0.99 0.003 240 / 0.9);border:1px solid oklch(0.85 0.02 240);border-radius:16px;box-shadow:0 12px 32px oklch(0.4 0.06 245 / 0.16);padding:22px;transition:box-shadow 0.2s ease, border-color 0.2s ease;\">\n        <textarea ref=\"{{ textareaRef }}\" placeholder=\"e.g. What is the single biggest blocker stopping mid-market SaaS buyers from adopting an AI-native support tool over their current helpdesk?\" value=\"{{ question }}\" sc-camel-on-change=\"{{ onQuestionChange }}\" style=\"width:100%;height:179px;border:none;resize:none;overflow-y:auto;font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;color:oklch(0.24 0.03 258);outline:none;background:transparent;\"><\u002Ftextarea>\n        <div style=\"text-align:right;font-size:11px;color:{{ wordCountColor }};margin-top:-4px;font-family:'Space Mono',monospace;transition:color 0.15s ease;\">{{ wordCount }}/100<\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ dims }}\" as=\"dim\" hint-placeholder-count=\"3\">\n            <div data-dim-wrapper=\"true\" style=\"position:relative;flex:1;min-width:170px;\">\n              <div sc-camel-on-click=\"{{ dim.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid oklch(0.83 0.02 240);background:white;cursor:pointer;font-size:12.5px;font-weight:600;color:oklch(0.24 0.03 258);\">\n                <span>{{ dim.selectedLabel }}<\u002Fspan>\n                <span style=\"color:oklch(0.55 0.02 255);font-size:11px;\">▾<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ dim.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:white;border:1px solid oklch(0.85 0.02 240);border-radius:10px;box-shadow:0 10px 28px oklch(0.4 0.06 245 / 0.2);padding:6px;display:flex;flex-direction:column;gap:2px;\">\n                  <div sc-camel-on-click=\"{{ dim.selectAllToggle }}\" style=\"display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;cursor:pointer;border-bottom:1px solid oklch(0.9 0.01 240);margin-bottom:2px;\" style-hover=\"background:oklch(0.96 0.015 240);\">\n                    <span style=\"{{ dim.selectAllBoxStyle }}\">{{ dim.selectAllCheckMark }}<\u002Fspan>\n                    <span style=\"flex:1;font-size:12.5px;font-weight:600;color:oklch(0.24 0.03 258);\">{{ dim.selectAllLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ dim.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ opt.select }}\" style=\"display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;cursor:pointer;\" style-hover=\"background:oklch(0.96 0.015 240);\">\n                      <span style=\"{{ opt.boxStyle }}\">{{ opt.checkMark }}<\u002Fspan>\n                      <span style=\"flex:1;font-size:12.5px;color:oklch(0.24 0.03 258);\">{{ opt.label }}<\u002Fspan>\n                      <span style=\"font-family:'Space Mono',monospace;font-size:10.5px;color:oklch(0.55 0.02 255);\">({{ opt.count }})<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:22px;margin-top:14px;font-size:12px;color:oklch(0.42 0.03 258);\">\n          <span>Total audience: <strong style=\"color:oklch(0.22 0.03 258);display:inline-block;min-width:12px;\">\n              <sc-if value=\"{{ totalLoaded }}\" hint-placeholder-val=\"{{ true }}\">{{ totalAudience }}<\u002Fsc-if>\n              <sc-if value=\"{{ totalNotLoaded }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"s8b-dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fsc-if>\n            <\u002Fstrong><span class=\"s8b-info-wrap\"><sup style=\"cursor:help;color:oklch(0.55 0.02 255);font-size:10px;margin-left:2px;\">ⓘ<\u002Fsup><span class=\"s8b-tooltip\">Available number of AI personas that match your filter.<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\">Sample size:\n            <input class=\"s8b-sample-input\" type=\"text\" sc-camel-input-mode=\"numeric\" value=\"{{ sampleSize }}\" placeholder=\"{{ samplePlaceholder }}\" sc-camel-on-change=\"{{ onSampleSizeChange }}\" style=\"width:42px;border:none;border-bottom:1.5px dashed oklch(0.6 0.02 255);background:transparent;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:oklch(0.22 0.03 258);outline:none;padding:0 2px;\">\n            <span class=\"s8b-info-wrap\"><sup style=\"cursor:help;color:oklch(0.55 0.02 255);font-size:10px;\">ⓘ<\u002Fsup><span class=\"s8b-tooltip\">Number of AI personas - picked randomly - to run the survey. (&lt;50)<\u002Fspan><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasRunError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n          <span style=\"font-size:12.5px;font-weight:600;color:oklch(0.55 0.2 25);\">{{ runError }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;justify-content:center;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ runButtonClick }}\" style=\"width:220px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:17px;border:none;background:linear-gradient(120deg, oklch(0.68 0.16 40), oklch(0.55 0.17 35));box-shadow:none;color:white;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:17px;cursor:pointer;transition:transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;\" style-hover=\"filter:brightness(1.08);box-shadow:0 14px 30px oklch(0.68 0.17 38 / 0.4);transform:translateY(-2px);\" style-active=\"transform:scale(0.985);filter:brightness(0.97);box-shadow:0 9px 18px oklch(0.6 0.17 38 / 0.32);\">\n          <sc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"display:flex;align-items:center;gap:7px;\">Running<span class=\"s8b-dots s8b-dots-onbutton\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notRunning }}\" hint-placeholder-val=\"{{ true }}\">\n            <span>{{ runButtonLabel }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:oklch(0.45 0.03 258);font-family:'Space Mono',monospace;\">\n          <span>{{ runningStatusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showResult }}\" hint-placeholder-val=\"{{ false }}\">\n        <div id=\"result-card\" data-screen-label=\"Result\" style=\"margin-top:26px;background:oklch(0.99 0.003 240 / 0.92);border:1px solid oklch(0.85 0.02 240);border-radius:16px;box-shadow:0 12px 32px oklch(0.4 0.06 245 / 0.16);padding:26px 26px 18px;display:flex;flex-direction:column;gap:16px;\">\n          <div class=\"s8b-result-top-row\" style=\"display:flex;gap:28px;flex-wrap:wrap;\">\n            <div style=\"flex:0 0 180px;display:flex;flex-direction:column;align-items:center;gap:14px;\">\n              <div style=\"position:relative;width:130px;height:130px;border-radius:50%;background:{{ resultChartGradient }};\">\n                <div style=\"position:absolute;inset:22px;border-radius:50%;background:oklch(0.99 0.003 240);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"s8b-legend-list\" style=\"font-size:11px;line-height:1.35;width:100%;display:flex;flex-direction:column;gap:7px;\">\n                <sc-for list=\"{{ resultCategories }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                  <div class=\"s8b-legend-row\" style=\"display:flex;align-items:baseline;gap:6px;\"><span style=\"width:9px;height:9px;border-radius:2px;background:{{ cat.color }};border:1px solid oklch(0.85 0.01 240 / 0.5);flex:none;position:relative;top:-0.5px;\"><\u002Fspan><span>{{ cat.label }} {{ cat.percentageText }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:260px;\">\n              <div style=\"font-weight:600;color:oklch(0.22 0.03 258);font-size:14px;line-height:1.5;margin-bottom:10px;\">{{ keyTakeaway }}<\u002Fdiv>\n              <p style=\"font-size:13px;line-height:1.7;color:oklch(0.34 0.03 258);margin:0;\">{{ summaryText }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid oklch(0.9 0.01 240);padding-top:16px;\">\n            <span style=\"font-size:12px;color:oklch(0.5 0.02 258);\">For detailed report, <a href=\"#\" sc-camel-on-click=\"{{ downloadResults }}\" style=\"color:oklch(0.5 0.15 40);text-decoration:none;font-weight:600;\" style-hover=\"text-decoration:underline;\">download this file<\u002Fa>, and ask an AI agent (ChatGPT, Claude etc.) to analyze.<\u002Fspan>\n            <div style=\"display:flex;gap:10px;\">\n              <span title=\"Copy\" sc-camel-on-click=\"{{ copyResults }}\" style=\"position:relative;width:40px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid oklch(0.82 0.02 240);cursor:pointer;color:oklch(0.3 0.03 258);transition:background 0.12s ease, border-color 0.12s ease, transform 0.1s ease;\" style-hover=\"background:oklch(0.96 0.015 240);border-color:oklch(0.72 0.02 240);\" style-active=\"transform:scale(0.94);background:oklch(0.93 0.015 240);\">\n                <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg>\n                <sc-if value=\"{{ copyConfirmed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"s8b-copied-badge\">Copied!<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span title=\"Save screenshot\" sc-camel-on-click=\"{{ saveScreenshot }}\" style=\"position:relative;width:40px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid oklch(0.82 0.02 240);cursor:pointer;color:oklch(0.3 0.03 258);transition:background 0.12s ease, border-color 0.12s ease, transform 0.1s ease;\" style-hover=\"background:oklch(0.96 0.015 240);border-color:oklch(0.72 0.02 240);\" style-active=\"transform:scale(0.94);background:oklch(0.93 0.015 240);\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n                <sc-if value=\"{{ shotConfirmed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"s8b-copied-badge\">Screenshot saved!<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ shotFailed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"s8b-copied-badge\">Couldn't save — try again<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Example surveys\" style=\"padding:100px 24px 70px;\">\n    <div class=\"s8b-cards-row\" style=\"max-width:1180px;margin:0 auto;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;\">\n      <sc-for list=\"{{ exampleCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ card.open }}\" class=\"s8b-card-item\" style=\"flex:1;min-width:220px;max-width:260px;background:oklch(0.99 0.003 240 / 0.9);border:1px solid oklch(0.85 0.02 240);border-radius:14px;box-shadow:0 8px 22px oklch(0.4 0.06 245 / 0.12);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;\" style-hover=\"box-shadow:0 16px 34px oklch(0.4 0.06 245 / 0.22);transform:translateY(-3px);border-color:oklch(0.78 0.02 240);\">\n          <img src=\"{{ card.img }}\" alt=\"{{ card.title }}\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center;display:block;\">\n          <div style=\"padding:16px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"font-weight:600;font-size:14px;color:oklch(0.24 0.03 258);\">{{ card.title }}<\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:600;color:oklch(0.5 0.15 40);text-decoration:none;\" style-hover=\"text-decoration:underline;\">Explore survey &gt;<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ previewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeSurveyPreview }}\" style=\"position:fixed;inset:0;background:rgba(10,16,26,0.72);z-index:100;\">\n        <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"position:absolute;inset:12.5%;border-radius:8px;overflow:hidden;background:white;box-shadow:0 20px 60px rgba(0,0,0,0.4);\">\n          <div style=\"display:flex;width:100%;height:100%;transition:transform 0.35s ease;transform:{{ previewTrackTransform }};\">\n            <sc-for list=\"{{ exampleCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n              <div style=\"flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;\">\n                <img src=\"{{ card.shot }}\" alt=\"{{ card.title }}\" class=\"s8b-shot-desktop\" style=\"max-width:100%;max-height:100%;object-fit:contain;\">\n                <img src=\"{{ card.shotMobile }}\" alt=\"{{ card.title }}\" class=\"s8b-shot-mobile\" style=\"max-width:100%;max-height:100%;object-fit:contain;display:none;\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showPrevArrow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ goPrev }}\" style=\"position:absolute;top:50%;left:calc(12.5% - 56px);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.92);color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:background 0.12s ease;\" style-hover=\"background:white;\">‹<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showNextArrow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ goNext }}\" style=\"position:absolute;top:50%;right:calc(12.5% - 56px);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.92);color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:background 0.12s ease;\" style-hover=\"background:white;\">›<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ closeSurveyPreview }}\" style=\"position:absolute;top:calc(12.5% - 20px);right:calc(12.5% - 20px);width:40px;height:40px;border-radius:50%;background:white;color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.3);border:1px solid oklch(0.85 0.02 240);transition:background 0.12s ease, transform 0.12s ease;\" style-hover=\"background:oklch(0.97 0.01 240);transform:scale(1.05);\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;\">\n    <div style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3;\">\n      <sc-for list=\"{{ rainDrops }}\" as=\"d\" hint-placeholder-count=\"12\">\n        <div style=\"position:absolute;left:{{ d.left }}%;top:-5%;width:{{ d.width }}px;height:{{ d.len }}px;background:linear-gradient(to bottom, transparent, oklch(0.92 0.02 235 / {{ d.opacity }}), transparent);animation:rainFall {{ d.dur }}s linear infinite;animation-delay:{{ d.delay }}s;\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div id=\"what\" data-screen-label=\"What\" style=\"position:relative;padding:80px 24px;text-align:center;\">\n      <div style=\"position:relative;max-width:680px;margin:0 auto;\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:28px;color:white;margin:0 0 22px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">What is Survey8b?<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.8;color:oklch(0.95 0.01 250);margin:0 0 18px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Keyword volume and difficulty are numbers. Intent isn't — until now.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:oklch(0.95 0.01 250);margin:0 0 22px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Survey8b lets you test whether your audience actually wants the content or product you're about to create by letting you ask their AI personas. Built on <a href=\"https://matraix.ai/\" target=\"_blank\" rel=\"noopener\" style=\"color:oklch(0.95 0.01 250);text-decoration:none;font-weight:600;\" style-hover=\"text-decoration:underline;\">MatrAIx<\u002Fa>'s open persona research: ~1M simulated individuals, each with real demographic and psychographic traits, modeled from public data.<\u002Fp>\n        <a href=\"https://lnkd.in/p/gCwb6cTr\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:600;color:oklch(0.5 0.15 40);text-decoration:none;\" style-hover=\"text-decoration:underline;\">Learn more about the methodology &gt;<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"why\" data-screen-label=\"Why\" style=\"padding:80px 24px;\">\n      <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:48px;flex-wrap:wrap;\">\n        <div style=\"flex:1;min-width:280px;\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Why use Survey8b?<\u002Fh2>\n          <sc-for list=\"{{ whyItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;\">\n              <span style=\"width:20px;height:20px;flex:none;border-radius:6px;background:white;color:oklch(0.5 0.15 40);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;\">✓<\u002Fspan>\n              <span style=\"font-size:14px;color:white;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ item }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"s8b-decor-wrap\" style=\"position:relative;flex:0 0 300px;width:300px;height:375px;pointer-events:none;overflow:hidden;-webkit-mask-image:radial-gradient(120% 115% at 50% 48%, black 52%, transparent 86%);mask-image:radial-gradient(120% 115% at 50% 48%, black 52%, transparent 86%);\">\n          <svg width=\"0\" height=\"0\" style=\"position:absolute;pointer-events:none;\" aria-hidden=\"true\"><defs><filter id=\"seaKey\" color-interpolation-filters=\"sRGB\"><feColorMatrix type=\"matrix\" values=\"0 0 0 0 0.176  0 0 0 0 0.353  0 0 0 0 0.545  -0.96 -3.22 -0.33 0 2.7\"><\u002FfeColorMatrix><feComponentTransfer><feFuncA type=\"table\" sc-camel-table-values=\"0 0 0.35 0.8 1 1\"><\u002FfeFuncA><\u002FfeComponentTransfer><\u002Ffilter><\u002Fdefs><\u002Fsvg>\n        <img src=\"https://cdnb.artstation.com/p/assets/images/images/070/779/855/original/bera-burucu-boat-x.gif?1703496211\" alt=\"\" class=\"s8b-decor-bg\" style=\"position:absolute;top:50%;left:50%;width:128%;height:128%;transform:translate(-50%,-50%);object-fit:cover;display:block;filter:url(#seaKey);opacity:0.85;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"how\" data-screen-label=\"How\" style=\"padding:80px 24px;\">\n      <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:48px;flex-wrap:wrap;\">\n        <div class=\"s8b-decor-wrap\" style=\"position:relative;flex:0 0 240px;width:240px;height:180px;pointer-events:none;order:1;\">\n          <img src=\"ace7afba-c59f-4ebe-8d20-ade548443077\" alt=\"\" class=\"s8b-decor-bg\" style=\"width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:screen;filter:grayscale(1) sepia(1) hue-rotate(178deg) saturate(2.6) brightness(1.1) contrast(1.1);opacity:0.95;\">\n        <\u002Fdiv>\n        <div class=\"s8b-how-text\" style=\"flex:1;min-width:280px;order:2;padding-left:80px;\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">How to use Survey8b?<\u002Fh2>\n        <sc-for list=\"{{ howSteps }}\" as=\"step\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:16px;padding:14px 0;\">\n            <div style=\"width:34px;height:34px;flex:none;border-radius:9px;background:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:oklch(0.5 0.15 40);font-family:'Space Mono',monospace;\">{{ step.num }}<\u002Fdiv>\n            <div>\n              <div style=\"font-weight:600;font-size:14px;color:white;margin-bottom:4px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ step.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:oklch(0.9 0.01 250);line-height:1.6;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ step.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"faqs\" data-screen-label=\"FAQs\" style=\"position:relative;padding:80px 24px 60px;\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-align:center;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">FAQs<\u002Fh2>\n      <div style=\"max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"faq\" hint-placeholder-count=\"4\">\n          <div style=\"background:oklch(0.99 0.003 240 / 0.94);border:1px solid oklch(0.85 0.02 240);border-radius:14px;box-shadow:0 8px 22px oklch(0.2 0.06 255 / 0.22);padding:18px 20px;cursor:pointer;\" sc-camel-on-click=\"{{ faq.toggle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:oklch(0.24 0.03 258);\">\n              <span>{{ faq.q }}<\u002Fspan>\n              <span style=\"flex:none;margin-left:12px;font-family:'Space Mono',monospace;color:oklch(0.5 0.15 40);\">{{ faq.icon }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ faq.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;line-height:1.6;color:oklch(0.42 0.03 258);margin:12px 0 0;\"><sc-for list=\"{{ faq.parts }}\" as=\"part\" hint-placeholder-count=\"1\"><sc-if value=\"{{ part.isLink }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ part.href }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stopPropagation }}\" style=\"color:oklch(0.5 0.15 40);text-decoration:none;font-weight:600;\" style-hover=\"text-decoration:underline;\">{{ part.text }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ part.isText }}\" hint-placeholder-val=\"{{ true }}\">{{ part.text }}<\u002Fsc-if><\u002Fsc-for><\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <div data-screen-label=\"Footer\" class=\"s8b-footer\" style=\"position:relative;color:oklch(0.85 0.02 250);padding:48px 24px 30px;overflow:hidden;\">\n      <div style=\"position:absolute;left:0;right:0;top:0;height:20px;overflow:visible;pointer-events:none;\">\n        <sc-for list=\"{{ groundPixels }}\" as=\"p\" hint-placeholder-count=\"24\">\n          <div style=\"position:absolute;left:calc({{ p.leftPct }}% + {{ p.dx }}px);top:{{ p.top }}px;width:{{ p.size }}px;height:{{ p.size }}px;background:oklch(0.92 0.02 235 / {{ p.opacity }});animation:pixelSplash {{ p.dur }}s steps(1) infinite;animation-delay:{{ p.delay }}s;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"s8b-footer-row\" style=\"max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;\">\n        <div class=\"s8b-footer-brand\" style=\"max-width:320px;\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:white;margin-bottom:10px;\">Survey8b<\u002Fdiv>\n          <p style=\"font-size:12px;line-height:1.7;margin:0;color:white;\">AI-powered audien \",\n    selections: { region: [], role_function: [], economic_motivation: [] },\n    facetCounts: { region: {}, role_function: {}, economic_motivation: {} },\n    total: null,\n    facetsLoading: true,\n    facetsError: null,\n    openDropdown: null,\n    sampleSize: \"\",\n    running: false,\n    runElapsedSeconds: 0,\n    runError: null,\n    lastRunResult: null,\n    lastRunId: null,\n    copyConfirmed: false,\n    shotConfirmed: false,\n    shotFailed: false,\n    showResult: !!this.props.showResultOnLoad,\n    faqOpen: { 0: true },\n    scrolled: false,\n    overLimit: false,\n    previewIndex: null\n  };\n\n  openSurveyPreview = (i) => this.setState({ previewIndex: i });\n  closeSurveyPreview = () => this.setState({ previewIndex: null });\n  stopPropagation = (e) => e.stopPropagation();\n  goPrev = (e) => { e.stopPropagation(); this.setState(s => ({ previewIndex: Math.max(0, (s.previewIndex ?? 0) - 1) })); };\n  goNext = (e) => { e.stopPropagation(); this.setState(s => ({ previewIndex: Math.min(EXAMPLE_CARDS.length - 1, (s.previewIndex ?? 0) + 1) })); };\n\n  textareaRef = React.createRef();\n\n  scrollToInput = () => {\n    const el = this.textareaRef.current;\n    if (!el) return;\n    const rect = el.getBoundingClientRect();\n    const top = (window.scrollY || document.documentElement.scrollTop || 0) + rect.top - 120;\n    window.scrollTo({ top, behavior: \"smooth\" });\n    setTimeout(() => el.focus(), 450);\n  };\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const isScrolled = (window.scrollY || document.documentElement.scrollTop || 0) > 16;\n      if (isScrolled !== this.state.scrolled) this.setState({ scrolled: isScrolled });\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n\n    this.onDocMouseDown = (e) => {\n      if (this.state.openDropdown && !e.target.closest('[data-dim-wrapper=\"true\"]')) {\n        this.setState({ openDropdown: null });\n      }\n    };\n    document.addEventListener(\"mousedown\", this.onDocMouseDown);\n\n    this.fetchFacets();\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    document.removeEventListener(\"mousedown\", this.onDocMouseDown);\n    if (this._runTimer) clearInterval(this._runTimer);\n    if (this._copyTimer) clearTimeout(this._copyTimer);\n    if (this._shotTimer) clearTimeout(this._shotTimer);\n  }\n\n  // Faceted filtering: on every selection change, ask the backend for fresh\n  // counts under the *combined* current selection across all three fields.\n  // The backend excludes each field's own selection when computing that\n  // field's own option counts, so picking a value in Region immediately\n  // narrows what's shown for Profession and Spending Style, and vice versa\n  // — not just the field the user just touched.\n  fetchFacets = async () => {\n    const requestId = (this._facetRequestId = (this._facetRequestId || 0) + 1);\n    this.setState({ facetsLoading: true, facetsError: null });\n    try {\n      const base = this.props.apiBaseUrl || \"https://survey8b.onrender.com\";\n      const res = await fetch(`${base}/api/facets`, {\n        method: \"POST\",\n        headers: { \"Content-Type\": \"application/json\" },\n        body: JSON.stringify(this.state.selections)\n      });\n      if (!res.ok) throw new Error(`Facet request failed: ${res.status}`);\n      const data = await res.json();\n      if (requestId !== this._facetRequestId) return; // a newer request superseded this one\n      const facetCounts = { region: {}, role_function: {}, economic_motivation: {} };\n      for (const key of Object.keys(facetCounts)) {\n        for (const entry of data.facets?.[key] || []) {\n          facetCounts[key][entry.value] = entry.count;\n        }\n      }\n      this.setState({ total: data.total, facetCounts, facetsLoading: false });\n    } catch (err) {\n      if (requestId !== this._facetRequestId) return;\n      this.setState({ facetsLoading: false, facetsError: String(err) });\n    }\n  };\n\n  onQuestionChange = (e) => {\n    const val = e.target.value;\n    const newCount = val.trim() ? val.trim().split(/\\s+/).length : 0;\n    const oldCount = this.state.question.trim() ? this.state.question.trim().split(/\\s+/).length : 0;\n    if (newCount > 100 && newCount > oldCount) {\n      this.setState({ overLimit: true });\n      return;\n    }\n    this.setState({ question: val, overLimit: false });\n  };\n  onSampleSizeChange = (e) => {\n    const v = e.target.value.replace(/[^0-9]/g, \"\");\n    const max = this.effectiveMaxSampleSize();\n    this.setState({ sampleSize: v === \"\" ? \"\" : String(Math.min(Number(v), max)) });\n  };\n\n  // The cap shown in the placeholder and enforced on input: the smaller of\n  // the configured max and the current (live) matched population, so it\n  // stays honest once filters have narrowed the audience below the default.\n  effectiveMaxSampleSize = () => {\n    const propMax = this.props.maxSampleSize ?? 50;\n    return this.state.total != null ? Math.min(propMax, this.state.total) : propMax;\n  };\n\n  // The number actually used to run the survey: whatever the user typed, or\n  // the effective max if they left the field blank (matching the \"< N\"\n  // placeholder they saw).\n  effectiveSampleSize = () => {\n    return this.state.sampleSize !== \"\" ? Number(this.state.sampleSize) : this.effectiveMaxSampleSize();\n  };\n\n  toggleDropdown = (key) => this.setState(s => ({ openDropdown: s.openDropdown === key ? null : key }));\n  toggleOption = (key, value) => this.setState(s => {\n    const current = s.selections[key];\n    const next = current.includes(value) ? current.filter(v => v !== value) : [...current, value];\n    return { selections: { ...s.selections, [key]: next } };\n  }, this.fetchFacets);\n  toggleSelectAll = (key) => this.setState(s => {\n    const cfg = DIMENSIONS_CONFIG.find(c => c.key === key);\n    const allValues = cfg.options.map(o => o.value);\n    const allSelected = allValues.length > 0 && allValues.every(v => s.selections[key].includes(v));\n    return { selections: { ...s.selections, [key]: allSelected ? [] : allValues } };\n  }, this.fetchFacets);\n  downloadResults = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    if (!this.state.lastRunResult) return;\n    // Intentionally just the raw per-persona material (question, persona\n    // description, answer, reasoning) — no key_takeaway/summary here. This\n    // file is meant as input for the user's own AI agent to analyze; a\n    // pre-written summary would be redundant with that purpose. The\n    // key_takeaway/summary live in the results card and the survey_runs\n    // analytics log instead.\n    const content = JSON.stringify(this.state.lastRunResult.results, null, 2);\n    const blob = new Blob([content], { type: \"text/plain;charset=utf-8\" });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement(\"a\");\n    a.href = url;\n    const now = new Date();\n    const pad = (n) => String(n).padStart(2, \"0\");\n    const stamp = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${String(now.getFullYear()).slice(-2)}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;\n    a.download = `survey8b_result_${stamp}.txt`;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n    this.trackAction(\"download\");\n  };\n\n  buildCopyText = () => {\n    const r = this.state.lastRunResult;\n    if (!r) return \"\";\n    const filterLine = (label, values) => `- ${label}: ${values && values.length ? values.join(\", \") : \"N/A\"}`;\n    const breakdown = r.distribution.map(d => `${d.category} - ${d.pct}%`).join(\"\\n\");\n    return [\n      `Survey Question: ${r.question}`,\n      \"\",\n      \"Filters:\",\n      filterLine(\"Region\", r.filters.region),\n      filterLine(\"Profession\", r.filters.role_function),\n      filterLine(\"Spending Style\", r.filters.economic_motivation),\n      `Total audience: ${r.matched_count.toLocaleString(\"en-US\")}`,\n      `Sample size: ${r.sample_size}`,\n      \"\",\n      \"Response breakdown:\",\n      breakdown,\n      \"\",\n      `Key takeaway: ${r.key_takeaway}`,\n      \"\",\n      `Summary: ${r.summary}`\n    ].join(\"\\n\");\n  };\n\n  copyResults = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    if (!this.state.lastRunResult) return;\n    navigator.clipboard.writeText(this.buildCopyText()).then(() => {\n      if (this._copyTimer) clearTimeout(this._copyTimer);\n      this.setState({ copyConfirmed: true });\n      this._copyTimer = setTimeout(() => this.setState({ copyConfirmed: false }), 1800);\n      this.trackAction(\"copy\");\n    });\n  };\n\n  // ---- Screenshot export -------------------------------------------------\n  // Drawn directly onto a canvas rather than captured from the DOM: the\n  // shared image is a curated subset (no action row, no icons) plus promo\n  // footer, and DOM-capture libraries don't understand the oklch() colors\n  // this design is built on. Canvas parses oklch() natively, so the exact\n  // brand colors are reused here verbatim.\n\n  shotRoundRect = (ctx, x, y, w, h, r) => {\n    ctx.beginPath();\n    ctx.moveTo(x + r, y);\n    ctx.arcTo(x + w, y, x + w, y + h, r);\n    ctx.arcTo(x + w, y + h, x, y + h, r);\n    ctx.arcTo(x, y + h, x, y, r);\n    ctx.arcTo(x, y, x + w, y, r);\n    ctx.closePath();\n  };\n\n  shotWrap = (ctx, text, maxWidth) => {\n    const words = String(text).split(/\\s+/).filter(Boolean);\n    const lines = [];\n    let line = \"\";\n    for (const word of words) {\n      const candidate = line ? line + \" \" + word : word;\n      if (ctx.measureText(candidate).width > maxWidth && line) {\n        lines.push(line);\n        line = word;\n      } else {\n        line = candidate;\n      }\n    }\n    if (line) lines.push(line);\n    return lines;\n  };\n\n  shotFilterLines = () => {\n    return DIMENSIONS_CONFIG.map(cfg => {\n      const picked = this.state.selections[cfg.key];\n      return {\n        label: cfg.placeholder,\n        value: picked.length ? picked.join(\", \") : \"All\"\n      };\n    });\n  };\n\n  // The nav logo is a real file (images/s8b-logo.png), not one of the\n  // embedded blob URLs. Over http(s) it draws into the export canvas fine,\n  // but when the page is opened straight off disk (file://) every file is\n  // its own opaque origin, so drawing it TAINTS the canvas and the\n  // toBlob() that follows throws SecurityError — which killed the whole\n  // export silently. Probe on a throwaway 1x1 canvas first and skip the\n  // icon when it would poison the export; the \"Survey8b\" wordmark next to\n  // it is drawn as text either way, so the header still reads correctly.\n  shotSafeLogo = () => {\n    const img = document.querySelector(\"nav img\");\n    if (!img || !img.complete || !img.naturalWidth) return null;\n    try {\n      const probe = document.createElement(\"canvas\");\n      probe.width = probe.height = 1;\n      const pctx = probe.getContext(\"2d\");\n      pctx.drawImage(img, 0, 0, 1, 1);\n      pctx.getImageData(0, 0, 1, 1); // throws if the draw tainted the canvas\n      return img;\n    } catch (err) {\n      return null;\n    }\n  };\n\n  buildScreenshot = () => {\n    const r = this.state.lastRunResult;\n    const isMobile = window.innerWidth <= 640;\n    return isMobile ? this.buildScreenshotMobile(r) : this.buildScreenshotDesktop(r);\n  };\n\n  buildScreenshotDesktop = (r) => {\n    const S = 2; // 2x for a crisp, retina-quality PNG\n    const W = 1120;\n    const PAD = 56;\n    const innerW = W - PAD * 2;\n    const cardPad = 30;\n    const textW = innerW - cardPad * 2;\n\n    const measure = document.createElement(\"canvas\").getContext(\"2d\");\n\n    // --- measure pass: figure out the total height before sizing the canvas\n    measure.font = \"17px 'IBM Plex Sans', sans-serif\";\n    const qLines = this.shotWrap(measure, this.state.question.trim(), textW);\n\n    const donutBox = 240;\n    const rightW = textW - donutBox - 34;\n    measure.font = \"600 19px 'IBM Plex Sans', sans-serif\";\n    const takeLines = this.shotWrap(measure, r.key_takeaway, rightW);\n    measure.font = \"15px 'IBM Plex Sans', sans-serif\";\n    const sumLines = this.shotWrap(measure, r.summary, rightW);\n\n    const shown = r.distribution.filter(d => d.pct > 0);\n\n    const qBlockH = Math.max(qLines.length * 27, 54);\n    const inputCardH = cardPad + qBlockH + 26 + 46 + 30 + cardPad;\n    const rightColH = takeLines.length * 27 + 14 + sumLines.length * 25;\n    const leftColH = 190 + shown.length * 24;\n    const resultCardH = cardPad + Math.max(rightColH, leftColH) + cardPad;\n\n    const logoH = 58;\n    const footerH = 78;\n    const H = PAD + logoH + 34 + inputCardH + 30 + resultCardH + 40 + footerH;\n\n    // --- draw pass\n    const canvas = document.createElement(\"canvas\");\n    canvas.width = W * S;\n    canvas.height = H * S;\n    const ctx = canvas.getContext(\"2d\");\n    ctx.scale(S, S);\n    ctx.textBaseline = \"alphabetic\";\n\n    // sky background, same ramp as the page\n    const sky = ctx.createLinearGradient(0, 0, 0, H);\n    sky.addColorStop(0, \"oklch(0.96 0.012 235)\");\n    sky.addColorStop(0.35, \"oklch(0.89 0.03 240)\");\n    sky.addColorStop(0.72, \"oklch(0.74 0.055 246)\");\n    sky.addColorStop(1, \"oklch(0.58 0.07 250)\");\n    ctx.fillStyle = sky;\n    ctx.fillRect(0, 0, W, H);\n\n    let y = PAD;\n\n    // logo: cube image + wordmark\n    const logoImg = this.shotSafeLogo();\n    if (logoImg) {\n      ctx.drawImage(logoImg, PAD, y, 46, 46);\n    }\n    const wordGrad = ctx.createLinearGradient(PAD + 58, 0, PAD + 230, 0);\n    wordGrad.addColorStop(0, \"#E66D42\");\n    wordGrad.addColorStop(1, \"#C34422\");\n    ctx.fillStyle = wordGrad;\n    ctx.font = \"400 42px 'Micro 5', monospace\";\n    ctx.fillText(\"Survey8b\", PAD + 58, y + 38);\n    y += logoH + 34;\n\n    // ---- input card\n    ctx.fillStyle = CARD_BG;\n    this.shotRoundRect(ctx, PAD, y, innerW, inputCardH, 18);\n    ctx.fill();\n    ctx.strokeStyle = \"oklch(0.85 0.02 240)\";\n    ctx.lineWidth = 1;\n    ctx.stroke();\n\n    let cy = y + cardPad + 20;\n    ctx.fillStyle = \"oklch(0.24 0.03 258)\";\n    ctx.font = \"17px 'IBM Plex Sans', sans-serif\";\n    qLines.forEach(line => { ctx.fillText(line, PAD + cardPad, cy); cy += 27; });\n\n    // word count, right aligned\n    cy = y + cardPad + qBlockH + 20;\n    ctx.textAlign = \"right\";\n    ctx.fillStyle = \"oklch(0.55 0.02 258)\";\n    ctx.font = \"13px 'Space Mono', monospace\";\n    const wc = this.state.question.trim() ? this.state.question.trim().split(/\\s+/).length : 0;\n    ctx.fillText(wc + \"/100\", PAD + innerW - cardPad, cy);\n    ctx.textAlign = \"left\";\n\n    // filter pills\n    cy += 22;\n    const gap = 12;\n    const pillW = (textW - gap * 2) / 3;\n    this.shotFilterLines().forEach((f, i) => {\n      const px = PAD + cardPad + i * (pillW + gap);\n      ctx.fillStyle = \"white\";\n      this.shotRoundRect(ctx, px, cy, pillW, 46, 11);\n      ctx.fill();\n      ctx.strokeStyle = \"oklch(0.83 0.02 240)\";\n      ctx.stroke();\n      ctx.fillStyle = \"oklch(0.45 0.03 258)\";\n      ctx.font = \"11px 'IBM Plex Sans', sans-serif\";\n      ctx.fillText(f.label.toUpperCase(), px + 13, cy + 17);\n      ctx.fillStyle = \"oklch(0.24 0.03 258)\";\n      ctx.font = \"600 13px 'IBM Plex Sans', sans-serif\";\n      let v = f.value;\n      while (ctx.measureText(v).width > pillW - 26 && v.length > 4) v = v.slice(0, -2);\n      if (v !== f.value) v = v.replace(/[,\\s]+$/, \"\") + \"…\";\n      ctx.fillText(v, px + 13, cy + 35);\n    });\n\n    // audience + sample size\n    cy += 46 + 26;\n    ctx.font = \"13px 'IBM Plex Sans', sans-serif\";\n    ctx.fillStyle = \"oklch(0.42 0.03 258)\";\n    ctx.fillText(\"Total audience:\", PAD + cardPad, cy);\n    const law = ctx.measureText(\"Total audience: \" tate({ showResult: false, runError: null }); return; }\n    this.runSurvey();\n  };\n\n  toggleFaq = (i) => this.setState(s => ({ faqOpen: { ...s.faqOpen, [i]: !s.faqOpen[i] } }));\n\n  renderVals() {\n    const wordCount = this.state.question.trim() ? this.state.question.trim().split(/\\s+/).length : 0;\n    // Only show a loading indicator before the very first successful fetch.\n    // On every subsequent selection change, keep showing the previous\n    // (still-accurate-until-replaced) numbers instead of blanking them —\n    // swapping stale-but-present numbers for fresh ones the instant the\n    // response lands reads as instant, where flashing every number to a\n    // placeholder on every click reads as slow/janky.\n    const neverLoaded = this.state.total === null;\n    const dims = DIMENSIONS_CONFIG.map(cfg => {\n      const selectedValues = this.state.selections[cfg.key];\n      const allValues = cfg.options.map(o => o.value);\n      const allSelected = allValues.length > 0 && allValues.every(v => selectedValues.includes(v));\n      const labelText = cfg.required ? `* ${cfg.placeholder}` : cfg.placeholder;\n      const counts = this.state.facetCounts[cfg.key] || {};\n      const fieldTotal = allValues.reduce((sum, v) => sum + (counts[v] || 0), 0);\n      return {\n        open: this.state.openDropdown === cfg.key,\n        toggle: () => this.toggleDropdown(cfg.key),\n        selectedLabel: selectedValues.length > 0\n          ? `${labelText} (${selectedValues.length} selected)`\n          : `${labelText} (${neverLoaded ? \"…\" : formatCount(fieldTotal)})`,\n        selectAllLabel: allSelected ? \"Deselect all\" : \"Select all\",\n        selectAllToggle: () => this.toggleSelectAll(cfg.key),\n        selectAllCheckMark: allSelected ? \"✓\" : \"\",\n        selectAllBoxStyle: allSelected\n          ? \"width:16px;height:16px;border-radius:4px;background:oklch(0.6 0.15 40);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;\"\n          : \"width:16px;height:16px;border-radius:4px;border:1.5px solid oklch(0.8 0.02 240);flex:none;\",\n        options: cfg.options.map(o => {\n          const checked = selectedValues.includes(o.value);\n          return {\n            label: o.label,\n            count: neverLoaded ? \"…\" : formatCount(counts[o.value] || 0),\n            select: () => this.toggleOption(cfg.key, o.value),\n            checkMark: checked ? \"✓\" : \"\",\n            boxStyle: checked\n              ? \"width:16px;height:16px;border-radius:4px;background:oklch(0.6 0.15 40);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;\"\n              : \"width:16px;height:16px;border-radius:4px;border:1.5px solid oklch(0.8 0.02 240);flex:none;\"\n          };\n        })\n      };\n    });\n\n    const totalLoaded = !neverLoaded;\n    const totalNotLoaded = neverLoaded;\n    const totalAudience = this.state.facetsError && neverLoaded ? \"—\" : formatCount(this.state.total);\n\n    const distribution = this.state.lastRunResult\n      ? this.state.lastRunResult.distribution.filter(d => d.pct > 0)\n      : [];\n    let cumulativePct = 0;\n    const resultCategories = distribution.map((d, i) => {\n      const start = cumulativePct;\n      cumulativePct += d.pct;\n      const color = RESULT_CHART_COLORS[i % RESULT_CHART_COLORS.length];\n      return { label: d.category, percentageText: `${d.pct}%`, color, gradientStop: `${color} ${start}% ${cumulativePct}%` };\n    });\n    const resultChartGradient = `conic-gradient(${resultCategories.map(c => c.gradientStop).join(\", \")})`;\n    const keyTakeaway = this.state.lastRunResult ? this.state.lastRunResult.key_takeaway : \"\";\n    const summaryText = this.state.lastRunResult ? this.state.lastRunResult.summary : \"\";\n\n    return {\n      textareaRef: this.textareaRef,\n      scrollToInput: this.scrollToInput,\n      wordCountColor: this.state.overLimit ? \"oklch(0.55 0.2 25)\" : \"oklch(0.55 0.02 258)\",\n      cloudsEnabled: this.props.cloudsAnimated ?? true,\n      cloudBig: CLOUD_BIG,\n      cloudMed: CLOUD_MED,\n      cloudSmall: CLOUD_SMALL,\n      rainDrops: RAIN_DROPS,\n      groundPixels: SPLASH_PIXELS,\n      navBg: this.state.scrolled ? \"oklch(0.98 0.005 240 / 0.2)\" : \"oklch(0.96 0.012 235 / 1)\",\n      navBorder: this.state.scrolled ? \"oklch(0.85 0.02 240 / 0.4)\" : \"oklch(0.96 0.012 235 / 1)\",\n      navBlur: this.state.scrolled ? \"blur(14px)\" : \"blur(0px)\",\n      question: this.state.question,\n      onQuestionChange: this.onQuestionChange,\n      wordCount,\n      dims,\n      sampleSize: this.state.sampleSize,\n      samplePlaceholder: `<${this.effectiveMaxSampleSize()}`,\n      onSampleSizeChange: this.onSampleSizeChange,\n      maxSampleSize: this.props.maxSampleSize ?? 50,\n      totalAudience,\n      totalLoaded,\n      totalNotLoaded,\n      runButtonLabel: this.state.showResult ? \"Reset\" : \"Run Survey\",\n      runButtonClick: this.handleRunButtonClick,\n      running: this.state.running,\n      notRunning: !this.state.running,\n      runningStatusLabel: this.state.running ? this.runningStatusLabel() : \"\",\n      runError: this.state.runError,\n      hasRunError: !!this.state.runError,\n      showResult: this.state.showResult,\n      resultCategories,\n      resultChartGradient,\n      keyTakeaway,\n      summaryText,\n      downloadResults: this.downloadResults,\n      copyResults: this.copyResults,\n      copyConfirmed: this.state.copyConfirmed,\n      saveScreenshot: this.saveScreenshot,\n      shotConfirmed: this.state.shotConfirmed,\n      shotFailed: this.state.shotFailed,\n      exampleCards: EXAMPLE_CARDS.map((c, i) => ({ ...c, open: () => this.openSurveyPreview(i) })),\n      previewOpen: this.state.previewIndex !== null,\n      previewTrackTransform: `translateX(-${(this.state.previewIndex ?? 0) * 100}%)`,\n      showPrevArrow: (this.state.previewIndex ?? 0) > 0,\n      showNextArrow: (this.state.previewIndex ?? 0) < EXAMPLE_CARDS.length - 1,\n      goPrev: this.goPrev,\n      goNext: this.goNext,\n      closeSurveyPreview: this.closeSurveyPreview,\n      stopPropagation: this.stopPropagation,\n      whyItems: WHY_ITEMS,\n      howSteps: HOW_STEPS,\n      faqs: FAQ_DATA.map((f, i) => ({\n        q: f.q,\n        parts: f.parts.map(p => ({ text: p.text, href: p.href || \"\", isLink: !!p.href, isText: !p.href })),\n        open: !!this.state.faqOpen[i],\n        icon: this.state.faqOpen[i] ? \"–\" : \"+\",\n        toggle: () => this.toggleFaq(i)\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
