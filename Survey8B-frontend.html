  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #eaf1f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #eaf1f8; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:0 0 18px;color:oklch(0.2 0.03 258);\">Survey Your Audience's <span style=\"color:oklch(0.5 0.15 40);\">Persona Agents<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.6;color:oklch(0.34 0.03 258);max-width:620px;margin:0 auto 32px;\">Validate your content and product ideas before investing any time &amp; money<br>by simply asking <strong style=\"font-weight:700;color:oklch(0.24 0.03 258);\">~1M simulated AI personas<\u002Fstrong><\u002Fp>\n    <\u002Fheader>\n\n    <div data-screen-label=\"Survey form\" style=\"position:relative;max-width:760px;margin:0 auto;padding:0 24px 48px;\">\n      <div id=\"survey-input-card\" style=\"background:oklch(0.99 0.003 240 / 0.9);border:1px solid oklch(0.85 0.02 240);border-radius:16px;box-shadow:0 12px 32px oklch(0.4 0.06 245 / 0.16);padding:22px;transition:box-shadow 0.2s ease, border-color 0.2s ease;\">\n        <textarea ref=\"{{ textareaRef }}\" placeholder=\"e.g. What is the single biggest blocker stopping mid-market SaaS buyers from adopting an AI-native support tool over their current helpdesk?\" value=\"{{ question }}\" sc-camel-on-change=\"{{ onQuestionChange }}\" style=\"width:100%;height:179px;border:none;resize:none;overflow-y:auto;font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;color:oklch(0.24 0.03 258);outline:none;background:transparent;\"><\u002Ftextarea>\n        <div style=\"text-align:right;font-size:11px;color:{{ wordCountColor }};margin-top:-4px;font-family:'Space Mono',monospace;transition:color 0.15s ease;\">{{ wordCount }}/100<\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ dims }}\" as=\"dim\" hint-placeholder-count=\"3\">\n            <div data-dim-wrapper=\"true\" style=\"position:relative;flex:1;min-width:170px;\">\n              <div sc-camel-on-click=\"{{ dim.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;bo               <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:22px;margin-top:14px;font-size:12px;color:oklch(0.42 0.03 258);\">\n          <span>Total audience: <strong style=\"color:oklch(0.22 0.03 258);display:inline-block;min-width:12px;\">\n              <sc-if value=\"{{ totalLoaded }}\" hint-placeholder-val=\"{{ true }}\">{{ totalAudience }}<\u002Fsc-if>\n              <sc-if value=\"{{ totalNotLoaded }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"s8b-dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fsc-if>\n            <\u002Fstrong><span class=\"s8b-info-wrap\"><sup style=\"cursor:help;color:oklch(0.55 0.02 255);font-size:10px;margin-left:2px;\">ⓘ<\u002Fsup><span class=\"s8b-tooltip\">Available number of AI personas that match your filter.<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\">Sample size:\n            <input class=\"s8b-sample-input\" type=\"text\" sc-camel-input-mode=\"numeric\" value=\"{{ sampleSize }}\" placeholder=\"{{ samplePlaceholder }}\" sc-camel-on-change=\"{{ onSampleSizeChange }}\" style=\"width:42px;border:none;border-bottom:1.5px dashed oklch(0.6 0.02 255);background:transparent;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:oklch(0.22 0.03 258);outline:none;padding:0 2px;\">\n            <span class=\"s8b-info-wrap\"><sup style=\"cursor:help;color:oklch(0.55 0.02 255);font-size:10px;\">ⓘ<\u002Fsup><span class=\"s8b-tooltip\">Number of AI personas - picked randomly - to run the survey. (&lt;50)<\u002Fspan><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasRunError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n          <span style=\"font-size:12.5px;font-weight:600;color:oklch(0.55 0.2 25); 2 3h4a2 2 0 0 1 2 2z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n                <sc-if value=\"{{ shotConfirmed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"s8b-copied-badge\">Screenshot saved!<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Example surveys\" style=\"padding:100px 24px 70px;\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;\">\n      <sc-for list=\"{{ exampleCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ card.open }}\" style=\"flex:1;min-width:220px;max-width:260px;background:oklch(0.99 0.003 240 / 0.9);border:1px solid oklch(0.85 0.02 240);border-radius:14px;box-shadow:0 8px 22px oklch(0.4 0.06 245 / 0.12);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;\" style-hover=\"box-shadow:0 16px 34px oklch(0.4 0.06 245 / 0.22);transform:translateY(-3px);border-color:oklch(0.78 0.02 240);\">\n          <img src=\"{{ card.img }}\" alt=\"{{ card.title }}\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center;display:block;\">\n          <div style=\"padding:16px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"font-weight:600;font-size:14px;color:oklch(0.24 0.03 258);\">{{ card.title }}<\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:600;color:oklch(0.5 0.15 40);text-decoration:none;\" style-hover=\"text-decoration:underline;\">Explore survey &gt;<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ previewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeSurveyPreview }}\" style=\"position:fixed;inset:0;background:rgba(10,16,26,0.72);z-index:100;\">\n        <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"position:absolute;inset:12.5%;border-radius:8px;overflow:hidden;background:white;box-shadow:0 20px 60px rgba(0,0,0,0.4);\">\n          <div style=\"display:flex;width:100%;height:100%;transition:transform 0.35s ease;transform:{{ previewTrackTransform }};\">\n            <sc-for list=\"{{ exampleCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n              <div style=\"flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;\">\n                <img src=\"{{ card.shot }}\" alt=\"{{ card.title }}\" style=\"max-width:100%;max-height:100%;object-fit:contain;\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showPrevArrow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ goPrev }}\" style=\"position:absolute;top:50%;left:calc(12.5% - 56px);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.92);color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:background 0.12s ease;\" style-hover=\"background:white;\">‹<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showNextArrow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ goNext }}\" style=\"position:absolute;top:50%;right:calc(12.5% - 56px);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.92);color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.25);transition:background 0.12s ease;\" style-hover=\"background:white;\">›<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ closeSurveyPreview }}\" style=\"position:absolute;top:calc(12.5% - 20px);right:calc(12.5% - 20px);width:40px;height:40px;border-radius:50%;background:white;color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.3);border:1px solid oklch(0.85 0.02 240);transition:background 0.12s ease, transform 0.12s ease;\" style-hover=\"background:oklch(0.97 0.01 240);transform:scale(1.05);\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;\">\n    <div style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3;\">\n      <sc-for list=\"{{ rainDrops }}\" as=\"d\" hint-placeholder-count=\"12\">\n        <div style=\"position:absolute;left:{{ d.left }}%;top:-5%;width:{{ d.width }}px;height:{{ d.len }}px;background:linear-gradient(to bottom, transparent, oklch(0.92 0.02 235 / {{ d.opacity }}), transparent);animation:rainFall {{ d.dur }}s linear infinite;animation-delay:{{ d.delay }}s;\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div id=\"what\" data-screen-label=\"What\" style=\"position:relative;padding:80px 24px;text-align:center;\">\n      <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;height:360px;opacity:0.225;isolation:isolate;pointer-events:none;overflow:hidden;-webkit-mask-image:radial-gradient(closest-side, black 30%, transparent 70%);mask-image:radial-gradient(closest-side, black 30%, transparent 70%);\">\n        <img src=\"1cb95d33-499c-43e7-9937-5621ef26b074\" alt=\"\" style=\"position:absolute;top:50%;left:50%;width:170%;height:170%;transform:translate(-50%,-50%);object-fit:contain;filter:grayscale(1) sepia(1) hue-rotate(178deg) saturate(2.4) brightness(1.05) contrast(1.05);display:block;mix-blend-mode:multiply;\">\n      <\u002Fdiv>\n      <div style=\"position:relative;max-width:680px;margin:0 auto;\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:28px;color:white;margin:0 0 22px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">What is Survey8b?<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.8;color:oklch(0.95 0.01 250);margin:0 0 18px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Keyword volume and difficulty are numbers. Intent isn't — until now.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.8;color:oklch(0.95 0.01 250);margin:0 0 22px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Survey8b lets you test whether your audience actually wants the content or product you're about to create by letting you ask their AI personas. Built on <a href=\"https://matraix.ai/\" target=\"_blank\" rel=\"noopener\" style=\"color:oklch(0.95 0.01 250);text-decoration:none;font-weight:600;\" style-hover=\"text-decoration:underline;\">MatrAIx<\u002Fa>'s open persona research: ~1M simulated individuals, each with real demographic and psychographic traits, modeled from public data.<\u002Fp>\n        <a href=\"https://lnkd.in/p/gCwb6cTr\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:600;color:oklch(0.5 0.15 40);text-decoration:none;\" style-hover=\"text-decoration:underline;\">Learn more about the methodology &gt;<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"why\" data-screen-label=\"Why\" style=\"padding:80px 24px;\">\n      <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:48px;flex-wrap:wrap;\">\n        <div style=\"flex:1;min-width:280px;\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">Why use Survey8b?<\u002Fh2>\n          <sc-for list=\"{{ whyItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;\">\n              <span style=\"width:20px;height:20px;flex:none;border-radius:6px;background:white;color:oklch(0.5 0.15 40);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;\">✓<\u002Fspan>\n              <span style=\"font-size:14px;color:white;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ item }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"position:relative;flex:0 0 300px;width:300px;height:375px;pointer-events:none;overflow:hidden;-webkit-mask-image:radial-gradient(120% 115% at 50% 48%, black 52%, transparent 86%);mask-image:radial-gradient(120% 115% at 50% 48%, black 52%, transparent 86%);\">\n          <svg width=\"0\" height=\"0\" style=\"position:absolute;pointer-events:none;\" aria-hidden=\"true\"><defs><filter id=\"seaKey\" color-interpolation-filters=\"sRGB\"><feColorMatrix type=\"matrix\" values=\"0 0 0 0 0.176  0 0 0 0 0.353  0 0 0 0 0.545  -0.96 -3.22 -0.33 0 2.7\"><\u002FfeColorMatrix><feComponentTransfer><feFuncA type=\"table\" sc-camel-table-values=\"0 0 0.35 0.8 1 1\"><\u002FfeFuncA><\u002FfeComponentTransfer><\u002Ffilter><\u002Fdefs><\u002Fsvg>\n        <img src=\"https://cdnb.artstation.com/p/assets/images/images/070/779/855/original/bera-burucu-boat-x.gif?1703496211\" alt=\"\" style=\"position:absolute;top:50%;left:50%;width:128%;height:128%;transform:translate(-50%,-50%);object-fit:cover;display:block;filter:url(#seaKey);opacity:0.85;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"how\" data-screen-label=\"How\" style=\"padding:80px 24px;\">\n      <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:48px;flex-wrap:wrap;\">\n        <div style=\"position:relative;flex:0 0 240px;width:240px;height:180px;pointer-events:none;order:1;\">\n          <img src=\"ace7afba-c59f-4ebe-8d20-ade548443077\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:screen;filter:grayscale(1) sepia(1) hue-rotate(178deg) saturate(2.6) brightness(1.1) contrast(1.1);opacity:0.95;\">\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:280px;order:2;padding-left:80px;\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">How to use Survey8b?<\u002Fh2>\n        <sc-for list=\"{{ howSteps }}\" as=\"step\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:16px;padding:14px 0;\">\n            <div style=\"width:34px;height:34px;flex:none;border-radius:9px;background:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:oklch(0.5 0.15 40);font-family:'Space Mono',monospace;\">{{ step.num }}<\u002Fdiv>\n            <div>\n              <div style=\"font-weight:600;font-size:14px;color:white;margin-bottom:4px;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ step.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:oklch(0.9 0.01 250);line-height:1.6;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">{{ step.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"faqs\" data-screen-label=\"FAQs\" style=\"position:relative;padding:80px 24px 60px;\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;color:white;margin:0 0 26px;text-align:center;text-shadow:0 1px 2px rgba(5,8,16,0.6);\">FAQs<\u002Fh2>\n      <div style=\"max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"faq\" hint-placeholder-count=\"4\">\n          <div style=\"background:oklch(0.99 0.003 240 / 0.94);border:1px solid oklch(0.85 0.02 240);border-radius:14px;box-shadow:0 8px 22px oklch(0.2 0.06 255 / 0.22);padding:18px 20px;cursor:pointer;\" sc-camel-on-click=\"{{ faq.toggle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-weight:600;font-siz ,sans-serif;font-weight:700;font-size:18px;color:white;margin-bottom:10px;\">Survey8b<\u002Fdiv>\n          <p style=\"font-size:12px;line-height:1.7;margin:0;color:white;\">AI-powered audience simulation for SEO, content, and product teams. Validate before you write a single word.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;align-self:center;\">\n          <a href=\"https://linkedin.com/in/mayankbishwas\" target=\"_blank\" rel=\"noopener\" style=\"width:34px;height:34px;border-radius:50%;background:white;color:oklch(0.24 0.03 258);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;text-decoration:none;transition:background 0.12s ease, color 0.12s ease;\" style-hover=\"background:#E66D42;color:white;\">in<\u002Fa>\n          <div style=\"font-size:13px;color:white;\">Made to ☔ by <a href=\"https://tinyurl.com/mayankbishwas\" target=\"_blank\" rel=\"noopener\" style=\"color:#E66D42;text-decoration:none;\" style-hover=\"text-decoration:underline;\">Mayank<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:60px;flex-wrap:wrap;\">\n          <div>\n            <div style=\"font-weight:600;color:white;font-size:12px;margin-bottom:10px;\">Key Links<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;\">\n              <a href=\"https://matraix.ai/\" target=\"_blank\" rel=\"noopener\" style=\"color:white;text-decoration:none;transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">MatrAIx website<\u002Fa>\n              <a href=\"https://arxiv.org/html/2608.04205v1\" target=\"_blank\" rel=\"noopener\" style=\"color:white;text-decoration:none;transition:color 0.12s ease;\" style-hover=\"color:#E66D42;\">MatrAIx paper<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-weight:600;color:white;font-size:12px;margin-bottom: [\n      `Survey Question: ${r.question}`,\n      \"\",\n      \"Filters:\",\n      filterLine(\"Region\", r.filters.region),\n      filterLine(\"Profession\", r.filters.role_function),\n      filterLine(\"Spending Style\", r.filters.economic_motivation),\n      `Total audience: ${r.matched_count.toLocaleString(\"en-US\")}`,\n      `Sample size: ${r.sample_size}`,\n      \"\",\n      \"Response breakdown:\",\n      breakdown,\n      \"\",\n      `Key takeaway: ${r.key_takeaway}`,\n      \"\",\n      `Summary: ${r.summary}`\n    ].join(\"\\n\");\n  };\n\n  copyResults = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    if (!this.state.lastRunResult) return;\n    navigator.clipboard.writeText(this.buildCopyText()).then(() => {\n      if (this._copyTimer) clearTimeout(this._copyTimer);\n      this.setState({ copyConfirmed: true });\n      this._copyTimer = setTimeout(() => this.setState({ copyConfirmed: false }), 1800);\n    });\n  };\n\n  // ---- Screenshot export -------------------------------------------------\n  // Drawn directly onto a canvas rather than captured from the DOM: the\n  // shared image is a curated subset (no action row, no icons) plus promo\n  // footer, and DOM-capture libraries don't understand the oklch() colors\n  // this design is built on. Canvas parses oklch() natively, so the exact\n  // brand colors are reused here verbatim.\n\n  shotRoundRect = (ctx, x, y, w, h, r) => {\n    ctx.beginPath();\n    ctx.moveTo(x + r, y);\n    ctx.arcTo(x + w, y, x + w, y + h, r);\n    ctx.arcTo(x + w, y + h, x, y + h, r);\n    ctx.arcTo(x, y + h, x, y, r);\n    ctx.arcTo(x, y, x + w, y, r);\n    ctx.closePath();\n  };\n\n  shotWrap = (ctx, text, maxWidth) => {\n    const words = String(text).split(/\\s+/).filter(Boolean);\n    const lines = [];\n    let line = \"\";\n    for (const word of words) {\n      const candidate = line ? line + \" \" + word : word;\n      if (ctx.measureText(candidate).width > maxWidth && line) {\n        lines.push( everLoaded = this.state.total === null;\n    const dims = DIMENSIONS_CONFIG.map(cfg => {\n      const selectedValues = this.state.selections[cfg.key];\n      const allValues = cfg.options.map(o => o.value);\n      const allSelected = allValues.length > 0 && allValues.every(v => selectedValues.includes(v));\n      const labelText = cfg.required ? `* ${cfg.placeholder}` : cfg.placeholder;\n      const counts = this.state.facetCounts[cfg.key] || {};\n      const fieldTotal = allValues.reduce((sum, v) => sum + (counts[v] || 0), 0);\n      return {\n        open: this.state.openDropdown === cfg.key,\n        toggle: () => this.toggleDropdown(cfg.key),\n        selectedLabel: selectedValues.length > 0\n          ? `${labelText} (${selectedValues.length} selected)`\n          : `${labelText} (${neverLoaded ? \"…\" : formatCount(fieldTotal)})`,\n        selectAllLabel: allSelected ? \"Deselect all\" : \"Select all\",\n        selectAllToggle: () => this.toggleSelectAll(cfg.key),\n        selectAllCheckMark: allSelected ? \"✓\" : \"\",\n        selectAllBoxStyle: allSelected\n          ? \"width:16px;height:16px;border-radius:4px;background:oklch(0.6 0.15 40);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;\"\n          : \"width:16px;height:16px;border-radius:4px;border:1.5px solid oklch(0.8 0.02 240);flex:none;\",\n        options: cfg.options.map(o => {\n          const checked = selectedValues.includes(o.value);\n          return {\n            label: o.label,\n            count: neverLoaded ? \"…\" : formatCount(counts[o.value] || 0),\n            select: () => this.toggleOption(cfg.key, o.value),\n            checkMark: checked ? \"✓\" : \"\",\n            boxStyle: checked\n              ? \"width:16px;height:16px;border-radius:4px;background:oklch(0.6 0.15 40);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;\"\n              : \"width:16px;height:16px;border-radius:4px;border:1.5px solid oklch(0.8 0.02 240);flex:none;\"\n          };\n        })\n      };\n    });\n\n    const totalLoaded = !neverLoaded;\n    const totalNotLoaded = neverLoaded;\n    const totalAudience = this.state.facetsError && neverLoaded ? \"—\" : formatCount(this.state.total);\n\n    const distribution = this.state.lastRunResult\n      ? this.state.lastRunResult.distribution.filter(d => d.pct > 0)\n      : [];\n    let cumulativePct = 0;\n    const resultCategories = distribution.map((d, i) => {\n      const start = cumulativePct;\n      cumulativePct += d.pct;\n      const color = RESULT_CHART_COLORS[i % RESULT_CHART_COLORS.length];\n      return { label: d.category, percentageText: `${d.pct}%`, color, gradientStop: `${color} ${start}% ${cumulativePct}%` };\n    });\n    const resultChartGradient = `conic-gradient(${resultCategories.map(c => c.gradientStop).join(\", \")})`;\n    const keyTakeaway = this.state.lastRunResult ? this.state.lastRunResult.key_takeaway : \"\";\n    const summaryText = this.state.lastRunResult ? this.state.lastRunResult.summary : \"\";\n\n    return {\n      textareaRef: this.textareaRef,\n      scrollToInput: this.scrollToInput,\n      wordCountColor: this.state.overLimit ? \"oklch(0.55 0.2 25)\" : \"oklch(0.55 0.02 258)\",\n      cloudsEnabled: this.props.cloudsAnimated ?? true,\n      cloudBig: CLOUD_BIG,\n      cloudMed: CLOUD_MED,\n      cloudSmall: CLOUD_SMALL,\n      rainDrops: RAIN_DROPS,\n      groundPixels: SPLASH_PIXELS,\n      navBg: this.state.scrolled ? \"oklch(0.98 0.005 240 / 0.2)\" : \"oklch(0.96 0.012 235 / 1)\",\n      navBorder: this.state.scrolled ? \"oklch(0.85 0.02 240 / 0.4)\" : \"oklch(0.96 0.012 235 / 1)\",\n      navBlur: this.state.scrolled ? \"blur(14px)\" : \"blur(0px)\",\n      question: this.state.question,\n      onQuestionChange: this.onQuestionChange,\n      wordCount,\n      dims,\n      sampleSize: this.state.sampleSize,\n      samplePlaceholder: `<${this.effectiveMaxSampleSize()}`,\n      onSampleSizeChange: this.onSampleSizeChange,\n      maxSampleSize: this.props.maxSampleSize ?? 50,\n      totalAudience,\n      totalLoaded,\n      totalNotLoaded,\n      runButtonLabel: this.state.showResult ? \"Reset\" : \"Run Survey\",\n      runButtonClick: this.handleRunButtonClick,\n      running: this.state.running,\n      notRunning: !this.state.running,\n      runningStatusLabel: this.state.running ? this.runningStatusLabel() : \"\",\n      runError: this.state.runError,\n      hasRunError: !!this.state.runError,\n      showResult: this.state.showResult,\n      resultCategories,\n      resultChartGradient,\n      keyTakeaway,\n      summaryText,\n      downloadResults: this.downloadResults,\n      copyResults: this.copyResults,\n      copyConfirmed: this.state.copyConfirmed,\n      saveScreenshot: this.saveScreenshot,\n      shotConfirmed: this.state.shotConfirmed,\n      exampleCards: EXAMPLE_CARDS.map((c, i) => ({ ...c, open: () => this.openSurveyPreview(i) })),\n      previewOpen: this.state.previewIndex !== null,\n      previewTrackTransform: `translateX(-${(this.state.previewIndex ?? 0) * 100}%)`,\n      showPrevArrow: (this.state.previewIndex ?? 0) > 0,\n      showNextArrow: (this.state.previewIndex ?? 0) < EXAMPLE_CARDS.length - 1,\n      goPrev: this.goPrev,\n      goNext: this.goNext,\n      closeSurveyPreview: this.closeSurveyPreview,\n      stopPropagation: this.stopPropagation,\n      whyItems: WHY_ITEMS,\n      howSteps: HOW_STEPS,\n      faqs: FAQ_DATA.map((f, i) => ({\n        q: f.q,\n        parts: f.parts.map(p => ({ text: p.text, href: p.href || \"\", isLink: !!p.href, isText: !p.href })),\n        open: !!this.state.faqOpen[i],\n        icon: this.state.faqOpen[i] ? \"–\" : \"+\",\n        toggle: () => this.toggleFaq(i)\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
